name: ci

# Only run when something CI builds or tests changes. install.sh is covered by
# install_test.go; testdata/ holds the fixtures the tests read.
on:
  push:
    branches: [main]
    paths: &go-paths
      - "**.go"
      - go.mod
      - go.sum
      - "testdata/**"
      - "!**.md"
      - install.sh
      - .golangci.yml
      - .github/workflows/ci.yml
  pull_request:
    paths: *go-paths

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: lint (golangci-lint, incl. gofumpt + golines format check)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build -o /dev/null .
