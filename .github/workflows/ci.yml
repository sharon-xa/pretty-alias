name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: lint (golangci-lint, incl. gofumpt + golines format check)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build -o /dev/null .
